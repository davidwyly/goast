name: perfect-cuboid-heegner-43-71

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  heegner-generator:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Run PARI Heegner search in Sage
        id: heegner
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          docker run --rm --user root --entrypoint bash \
            -v "$GITHUB_WORKSPACE:/work:ro" sagemath/sagemath:9.4 \
            -lc 'cp -a /work/perfect_cuboid /tmp/perfect_cuboid && cd /tmp && sage perfect_cuboid/heegner_43_71.sage' \
            2>&1 | tee heegner-43-71-output.txt
          code=${PIPESTATUS[0]}; grep -q '^HEEGNER_COMPLETE True$' heegner-43-71-output.txt || code=1; echo "exit_code=$code" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heegner-43-71
          path: |
            heegner-43-71-output.txt
            heegner-43-71-point.txt
          if-no-files-found: warn
      - name: Fail if Sage process failed
        if: steps.heegner.outputs.exit_code != '0'
        run: exit 1

  deep-descent-generator:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Run deeper mwrank 2-descent
        id: descent
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          docker run --rm --user root --entrypoint bash \
            -v "$GITHUB_WORKSPACE:/work:ro" sagemath/sagemath:9.4 \
            -lc 'cp -a /work/perfect_cuboid /tmp/perfect_cuboid && cd /tmp && sage perfect_cuboid/deep_descent_43_71.sage' \
            2>&1 | tee deep-descent-43-71-output.txt
          code=${PIPESTATUS[0]}; grep -q '^DEEP_GENERATOR_COMPLETE True$' deep-descent-43-71-output.txt || code=1; echo "exit_code=$code" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: deep-descent-43-71
          path: |
            deep-descent-43-71-output.txt
            deep-descent-43-71-point.txt
          if-no-files-found: warn
      - name: Fail if Sage process failed
        if: steps.descent.outputs.exit_code != '0'
        run: exit 1

  specific-heegner-generator:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Run fixed-discriminant Heegner search
        id: specific
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          docker run --rm --user root --entrypoint bash \
            -v "$GITHUB_WORKSPACE:/work:ro" sagemath/sagemath:9.4 \
            -lc 'cp -a /work/perfect_cuboid /tmp/perfect_cuboid && cd /tmp && sage perfect_cuboid/heegner_specific_43_71.sage' \
            2>&1 | tee heegner-specific-43-71-output.txt
          code=${PIPESTATUS[0]}; grep -q '^SPECIFIC_HEEGNER_COMPLETE True$' heegner-specific-43-71-output.txt || code=1; echo "exit_code=$code" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heegner-specific-43-71
          path: |
            heegner-specific-43-71-output.txt
            heegner-specific-43-71-point.txt
          if-no-files-found: warn
      - name: Fail if Sage process failed
        if: steps.specific.outputs.exit_code != '0'
        run: exit 1

  isogeny-class-heegner:
    strategy:
      fail-fast: false
      matrix:
        curve_index: [0,1,2,3]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Run Heegner on isogenous curve ${{ matrix.curve_index }}
        id: iso
        continue-on-error: true
        shell: bash
        env:
          CURVE_INDEX: ${{ matrix.curve_index }}
        run: |
          set -o pipefail
          docker run --rm --user root --entrypoint bash \
            -e CURVE_INDEX="$CURVE_INDEX" \
            -v "$GITHUB_WORKSPACE:/work:ro" sagemath/sagemath:9.4 \
            -lc 'cp -a /work/perfect_cuboid /tmp/perfect_cuboid && cd /tmp && sage perfect_cuboid/heegner_isogenous_43_71.sage' \
            2>&1 | tee "heegner-isogenous-${CURVE_INDEX}-output.txt"
          code=${PIPESTATUS[0]}; grep -q "^ISOGENOUS_HEEGNER_COMPLETE ${CURVE_INDEX} True$" "heegner-isogenous-${CURVE_INDEX}-output.txt" || code=1; echo "exit_code=$code" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: heegner-isogenous-${{ matrix.curve_index }}
          path: |
            heegner-isogenous-${{ matrix.curve_index }}-output.txt
            heegner-isogenous-${{ matrix.curve_index }}-point.txt
          if-no-files-found: warn
      - name: Fail if Sage process failed
        if: steps.iso.outputs.exit_code != '0'
        run: exit 1
